version: "2"
output:
  formats:
    text:
      path: stdout
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - decorder
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - mnd
    - nakedret
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com
            - go.uber.org
            - golang.org
            - server-identify
    dupl:
      threshold: 150
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use logger instead of fmt.Print
        - pattern: ^os\.Exit$
          msg: os.Exit is not allowed outside of main
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - unnamedResult
        - hugeParam
        - whyNoLint
        - rangeValCopy
        - commentedOutCode
        - commentFormatting
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    govet:
      settings:
        printf:
          funcs:
            - Debugf
            - Infof
            - Warnf
            - Errorf
            - DPanicf
            - Panicf
            - Fatalf
            - Debugw
            - Infow
            - Warnw
            - Errorw
            - DPanicw
            - Panicw
            - Fatalw
    misspell:
      locale: US
    mnd:
      ignored-numbers:
        - '1'
        - '2'
        - '3'
      checks:
        - argument
        - case
        - condition
        - return
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
    revive:
      severity: warning
      rules:
        - name: indent-error-flow
          severity: warning
        - name: add-constant
          arguments:
            - allowFloats: 0.0,0.,1.0,1.,2.0,2.
              allowInts: 0,1,2,3,4
              allowStrs: '"","error","GET","POST","PUT","DELETE"'
          severity: warning
    testifylint:
      enable-all: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - status.Error(
        - ctx.Err()
      ignore-package-globs:
        - context
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - containedctx
          - funlen
          - goconst
          - maintidx
          - mnd
          - revive
          - gocognit
        path: _test\.go
      - linters:
          - gocritic
        text: 'unnecessaryDefer:'
      - linters:
          - staticcheck
        text: 'ST1003:'
    paths:
      - cmd/example
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - internal/generated
      - third_party$
      - builtin$
      - examples$
